<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WealthWatch - Terminal Finance Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>$</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="crt">

    <!-- Terminal frame -->
    <div class="terminal-frame">
      <div class="terminal-header">
        <span class="terminal-title-text">WealthWatch Terminal v1.0.0</span>
        <div class="terminal-controls">
          <span class="ctrl-btn">&#9472;</span>
          <span class="ctrl-btn">&#9633;</span>
          <span class="ctrl-btn ctrl-close">&#10005;</span>
        </div>
      </div>

      <div class="terminal-body" id="terminal">
        <!-- All output goes here -->
        <div id="output"></div>

        <!-- Input line -->
        <div class="input-line">
          <span class="input-prompt">></span>
          <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" placeholder="Type /help to get started">
        </div>
      </div>
    </div>

    <!-- Ticker bar -->
    <div class="ticker-bar" id="ticker-bar"></div>

  </div>

  <script src="terminal.js"></script>
</body>
</html>
