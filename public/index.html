<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c0c">
  <title>WealthWatch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>$</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top status bar -->
  <header class="status-bar">
    <div class="status-left">
      <span class="status-brand">[$] WealthWatch</span>
      <span class="status-sep">│</span>
      <span class="status-item">Terminal v1.0</span>
    </div>
    <div class="status-right">
      <span class="status-item" id="market-status">● MARKET OPEN</span>
      <span class="status-sep">│</span>
      <span class="status-item" id="clock"></span>
    </div>
  </header>

  <!-- Main terminal area -->
  <main class="terminal" id="terminal">
    <div id="output"></div>
    <div class="input-line">
      <span class="prompt">❯</span>
      <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" placeholder="type /help to get started">
    </div>
  </main>

  <!-- Bottom ticker bar -->
  <footer class="ticker-bar" id="ticker-bar">
    <div class="ticker-label">LIVE</div>
  </footer>

  <script src="terminal.js"></script>
</body>
</html>
