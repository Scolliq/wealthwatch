<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c0c">
  <title>WealthWatch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>$</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top status bar -->
  <header class="status-bar">
    <div class="status-left">
      <span class="status-brand">[$] WealthWatch</span>
      <span class="status-sep">|</span>
      <span class="status-item">Terminal v2.0</span>
    </div>
    <div class="status-right">
      <span class="status-item" id="auth-status"></span>
      <span class="status-sep" id="auth-sep">|</span>
      <span class="status-item" id="market-status">● MARKET OPEN</span>
      <span class="status-sep">|</span>
      <span class="status-item" id="clock"></span>
    </div>
  </header>

  <!-- Main terminal area -->
  <main class="terminal" id="terminal">
    <div id="output"></div>
    <div class="input-line">
      <span class="prompt">❯</span>
      <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" placeholder="type /help to get started">
    </div>
  </main>

  <!-- Portfolio Insights Dashboard -->
  <section class="insights-panel" id="insights-panel">
    <div class="insights-header">
      <span class="insights-title">PORTFOLIO INSIGHTS</span>
      <span class="insights-actions">
        <button class="insights-refresh-btn" id="insights-refresh" title="Refresh">↻</button>
        <button class="insights-toggle-btn" id="insights-toggle" title="Collapse">▼</button>
      </span>
    </div>
    <div class="insights-body" id="insights-body">
      <div class="insights-grid">
        <!-- Row 1: Key metrics -->
        <div class="insight-card" id="card-dividends">
          <div class="insight-card-title">DIVIDENDS</div>
          <div class="insight-card-body" id="insight-dividends">
            <span class="c-dim">Loading...</span>
          </div>
        </div>
        <div class="insight-card" id="card-rates">
          <div class="insight-card-title">RATES &amp; RISK-FREE</div>
          <div class="insight-card-body" id="insight-rates">
            <span class="c-dim">Loading...</span>
          </div>
        </div>
        <div class="insight-card" id="card-risk">
          <div class="insight-card-title">RISK METRICS</div>
          <div class="insight-card-body" id="insight-risk">
            <span class="c-dim">Loading...</span>
          </div>
        </div>
        <!-- Row 2: Correlation matrix -->
        <div class="insight-card insight-card-wide" id="card-correlation">
          <div class="insight-card-title">CORRELATION MATRIX</div>
          <div class="insight-card-body" id="insight-correlation">
            <span class="c-dim">Loading...</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bottom ticker bar -->
  <footer class="ticker-bar" id="ticker-bar">
    <div class="ticker-label">LIVE</div>
  </footer>

  <script src="terminal.js"></script>
</body>
</html>
